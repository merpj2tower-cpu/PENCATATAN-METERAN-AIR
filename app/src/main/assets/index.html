<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Catatan Meteran Air RUSUN PULO JAHE</title>
<style>
:root{--bg:#f4f7f6;--panel:#fff;--ink:#172a24;--muted:#61736b;--line:#dce6e0;--green:#087f5b;--soft:#e7f6ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
header{padding:20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.brand h1{margin:0;font-size:20px;color:var(--green)}
.sub{font-size:13px;color:var(--muted)}
main{max-width:1000px;margin:auto;padding:20px}
.panel{background:var(--panel);padding:20px;border-radius:12px;border:1px solid var(--line);margin-bottom:20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:bold;color:var(--muted);display:block;margin-bottom:5px}

/* VERY BASIC NATIVE SELECT FIX */
select, input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background-color: #fff;
    color: #000;
}
select {
    /* Forcing native android dropdown style */
    -webkit-appearance: menulist;
    appearance: menulist;
    height: 48px;
}

button {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #e0e0e0;
    color: #333;
}
button.primary { background: var(--green); color: #fff; }
button.danger { background: #d32f2f; color: #fff; }
button:disabled { opacity: 0.5; }

.camera-box { border: 2px dashed #ccc; padding: 15px; text-align: center; border-radius: 8px; }
#preview { width: 100%; max-height: 250px; object-fit: contain; margin-top: 10px; display: none; }
.table-wrap { overflow-x: auto; margin-top: 15px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); }
th { background: #f9f9f9; color: var(--muted); }
.tabs{display:flex;gap:10px;margin-bottom:15px}
.tab{background:none;border-bottom:2px solid transparent;color:var(--muted);border-radius:0;padding:10px;}
.tab.active{color:var(--green);border-color:var(--green)}
.section{display:none} .section.active{display:block}
@media(max-width:600px){.fields{grid-template-columns:1fr}}
</style>
<script src="exceljs.min.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <h1>RUSUN PULO JAHE</h1>
    <div class="sub">Catatan Meter Air Offline</div>
  </div>
  <div style="display:flex;gap:10px;">
    <button id="exportBtn" class="primary">↓ Ekspor Excel</button>
  </div>
</header>
<main>
<div class="panel">
  <form id="entryForm">
    <div class="fields">
      <div class="field">
        <label>TOWER</label>
        <select id="tower" required>
            <option value="">Pilih Tower</option>
            <option value="A">Tower A</option>
            <option value="B">Tower B</option>
        </select>
      </div>
      <div class="field">
        <label>LANTAI</label>
        <select id="floor" required></select>
      </div>
      <div class="field full">
        <label>UNIT</label>
        <select id="unit" required></select>
      </div>
      <div class="field full">
        <label>TANGGAL</label>
        <input type="date" id="date" required>
      </div>
      <div class="field full">
        <label>FOTO METER / KAMERA</label>
        <div class="camera-box">
          <input type="file" id="photo" accept="image/*" style="margin-bottom:10px;">
          <br>
          <button type="button" id="ocrBtn" disabled>🔍 Coba Baca Angka Otomatis (OCR)</button>
          <img id="preview">
          <p id="ocrStatus" style="font-size:12px;color:#666;"></p>
        </div>
      </div>
      <div class="field full">
        <label>ANGKA METER (m³)</label>
        <input type="number" id="reading" step="0.001" placeholder="Contoh: 125.500" required>
      </div>
      <div class="field full">
        <label>CATATAN KONDISI (Opsional)</label>
        <input type="text" id="notes" placeholder="Misal: Meteran buram, segel rusak">
      </div>
    </div>
    <div style="margin-top:20px; display:flex; gap:10px;">
      <button type="submit" class="primary" style="flex:1;">Simpan Data</button>
      <button type="reset" id="resetBtn">Reset</button>
    </div>
  </form>
</div>

<div class="panel">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('history', this)">Riwayat Data</button>
    <button class="tab" onclick="switchTab('summary', this)">Rekap 782 Unit</button>
  </div>
  
  <div id="history" class="section active">
    <div style="display:flex;gap:10px;margin-bottom:10px;">
        <select id="filterTower"><option value="">Semua Tower</option><option>A</option><option>B</option></select>
        <input type="text" id="searchUnit" placeholder="Cari unit (misal A-02-05)...">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Tgl</th><th>Unit</th><th>Meter (m³)</th><th>Pakai (m³)</th><th>Aksi</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

  <div id="summary" class="section">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Unit</th><th>Tgl Terakhir</th><th>Meter Terakhir</th><th>Pakai (m³)</th></tr></thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
  </div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const DBKEY='meterair_data_v2';
let records=JSON.parse(localStorage.getItem(DBKEY)||'[]');
let photoData='';

function save(){ localStorage.setItem(DBKEY, JSON.stringify(records)); render(); }
function locStr(r){ return `${r.tower}-${String(r.floor).padStart(2,'0')}-${String(r.unit).padStart(2,'0')}`; }

// Populate Dropdowns Simple
function initSelects(){
    let flr = $('floor'), unt = $('unit');
    flr.innerHTML = '<option value="">Pilih Lantai</option>';
    unt.innerHTML = '<option value="">Pilih Unit</option>';
    for(let i=2; i<=24; i++) flr.innerHTML += `<option value="${i}">Lantai ${i}</option>`;
    for(let i=1; i<=17; i++) unt.innerHTML += `<option value="${i}">Unit ${i}</option>`;
}
initSelects();
$('date').value = new Date().toLocaleDateString('sv-SE');

function switchTab(id, btn){
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active'); $(id).classList.add('active');
}

function prevRec(r){
    return records.filter(x => x.tower===r.tower && x.floor===r.floor && x.unit===r.unit && x.date < r.date)
                  .sort((a,b)=>b.date.localeCompare(a.date))[0];
}

function render(){
    let sorted = [...records].sort((a,b)=>b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
    
    // History
    let fTow = $('filterTower').value, sUni = $('searchUnit').value.toLowerCase();
    let filt = sorted.filter(r => (!fTow || r.tower===fTow) && (!sUni || locStr(r).toLowerCase().includes(sUni)));
    $('historyBody').innerHTML = filt.length ? filt.map(r=>{
        let p = prevRec(r); let u = p ? (r.reading - p.reading).toFixed(3) : '-';
        return `<tr><td>${r.date}</td><td><b>${locStr(r)}</b></td><td>${r.reading}</td>
        <td style="color:${u<0?'red':'black'}">${u}</td>
        <td><button onclick="del('${r.id}')" class="danger" style="padding:4px 8px;font-size:11px;">Hapus</button></td></tr>`;
    }).join('') : '<tr><td colspan="5" style="text-align:center;">Belum ada data.</td></tr>';

    // Summary
    let latest = {};
    sorted.forEach(r => { let k = locStr(r); if(!latest[k] || r.date > latest[k].date) latest[k] = r; });
    let arr = Object.values(latest).sort((a,b)=>locStr(a).localeCompare(locStr(b)));
    $('summaryBody').innerHTML = arr.length ? arr.map(r=>{
        let p = prevRec(r); let u = p ? (r.reading - p.reading).toFixed(3) : '-';
        return `<tr><td><b>${locStr(r)}</b></td><td>${r.date}</td><td>${r.reading}</td><td style="color:${u<0?'red':'black'}">${u}</td></tr>`;
    }).join('') : '<tr><td colspan="4" style="text-align:center;">Belum ada rekap.</td></tr>';
}

function del(id){
    if(confirm('Hapus data ini?')) { records = records.filter(x=>x.id!==id); save(); }
}

$('filterTower').onchange = render;
$('searchUnit').oninput = render;

$('photo').onchange = e => {
    let f = e.target.files[0];
    if(!f) return;
    let rd = new FileReader();
    rd.onload = () => {
        let img = new Image();
        img.onload = () => {
            let cv = document.createElement('canvas');
            let w=img.width, h=img.height, mx=640;
            if(w>mx || h>mx){ if(w>h){ h=Math.round(h*mx/w); w=mx; } else { w=Math.round(w*mx/h); h=mx; } }
            cv.width=w; cv.height=h;
            cv.getContext('2d').drawImage(img,0,0,w,h);
            photoData = cv.toDataURL('image/jpeg', 0.6);
            $('preview').src = photoData;
            $('preview').style.display = 'block';
            $('ocrBtn').disabled = false;
        };
        img.src = rd.result;
    };
    rd.readAsDataURL(f);
};

$('entryForm').onsubmit = e => {
    e.preventDefault();
    let r = {
        id: Date.now().toString(),
        tower: $('tower').value, floor: Number($('floor').value), unit: Number($('unit').value),
        date: $('date').value, reading: Number($('reading').value), notes: $('notes').value,
        photo: photoData, createdAt: Date.now()
    };
    if(records.some(x=>x.tower===r.tower && x.floor===r.floor && x.unit===r.unit && x.date===r.date)){
        if(!confirm('Data unit ini di tanggal yg sama sudah ada. Simpan dobel?')) return;
    }
    records.push(r); save(); alert('Tersimpan!');
    $('entryForm').reset(); $('date').value = new Date().toLocaleDateString('sv-SE');
    photoData=''; $('preview').style.display='none'; $('ocrBtn').disabled=true; $('ocrStatus').innerHTML='';
};

$('resetBtn').onclick = () => {
    setTimeout(()=>{ photoData=''; $('preview').style.display='none'; $('ocrBtn').disabled=true; $('ocrStatus').innerHTML=''; },10);
};

$('exportBtn').onclick = async () => {
    $('exportBtn').textContent = 'Memproses...';
    try {
        let lib = window.ExcelJS;
        if(!lib){ fallbackCSV(); return; }
        const wb = new lib.Workbook();
        const ws = wb.addWorksheet('Riwayat');
        ws.addRow(['Tanggal','Tower','Lantai','Unit','Kode Lokasi','Angka Meter (m³)','Pakai (m³)','Catatan','Foto']);
        ws.getRow(1).font = {bold:true, color:{argb:'FFFFFFFF'}};
        ws.getRow(1).fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF087F5B'}};
        
        let imRefs = [];
        let srtd = [...records].sort((a,b)=>a.date.localeCompare(b.date));
        srtd.forEach(r => {
            let p = prevRec(r); let u = p ? (r.reading - p.reading).toFixed(3) : '';
            let row = ws.addRow([r.date, r.tower, r.floor, r.unit, locStr(r), r.reading, u, r.notes, r.photo?'Ada Foto':'Tidak']);
            row.height = r.photo ? 70 : 20;
            if(r.photo){ try{ let iId=wb.addImage({base64:r.photo, extension:'jpeg'}); imRefs.push({ws, id:iId, rn:row.number}); }catch(e){} }
        });
        imRefs.forEach(x => x.ws.addImage(x.id, {tl:{col:8, row:x.rn-1}, br:{col:9, row:x.rn}}));
        
        const buf = await wb.xlsx.writeBuffer();
        let b = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        let a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'Laporan_Meter_Air.xlsx';
        a.click();
    } catch(e) { fallbackCSV(); }
    $('exportBtn').textContent = '↓ Ekspor Excel';
};

function fallbackCSV(){
    let csv = 'Tanggal,Tower,Lantai,Unit,Kode Lokasi,Meter,Pakai,Catatan\n';
    let srtd = [...records].sort((a,b)=>a.date.localeCompare(b.date));
    srtd.forEach(r => {
        let p = prevRec(r); let u = p ? (r.reading - p.reading).toFixed(3) : '';
        csv += `${r.date},${r.tower},${r.floor},${r.unit},${locStr(r)},${r.reading},${u},"${r.notes}"\n`;
    });
    let b = new Blob([csv], {type:'text/csv'});
    let a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'Laporan_Meter_Air.csv';
    a.click();
    alert('ExcelJS offline gagal, diekspor sebagai CSV.');
}

$('ocrBtn').onclick = async () => {
    $('ocrStatus').textContent = 'Memuat OCR... harap tunggu.';
    if(!window.Tesseract){
        let s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload = runOCR; s.onerror = () => $('ocrStatus').textContent = 'Gagal muat OCR.';
        document.head.appendChild(s);
    } else runOCR();
};

async function runOCR(){
    try {
        $('ocrStatus').textContent = 'Sedang membaca gambar...';
        let res = await Tesseract.recognize(photoData, 'eng');
        let txt = res.data.text || '';
        let nums = txt.replace(/[^0-9., ]/g,'').replace(/,/g,'.').split(' ').filter(x=>Number(x)>0);
        if(nums.length){
            $('reading').value = parseFloat(nums.sort((a,b)=>b.length-a.length)[0]);
            $('ocrStatus').textContent = 'Berhasil! Silakan cek kembali angkanya.';
        } else $('ocrStatus').textContent = 'Angka tidak jelas. Ketik manual saja.';
    } catch(e) { $('ocrStatus').textContent = 'Gagal membaca.'; }
}

render();
</script></body></html>
